<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム字幕翻訳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #f0f0f8;
    --text-dim: #7a7a9a;
    --subtitle-bg: rgba(0,0,0,0.85);
    --green: #00ff9d;
    --red: #ff4466;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === SCREENS === */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* === SETUP SCREEN === */
  #setup-screen {
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at 30% 20%, rgba(0,229,255,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(255,107,53,0.05) 0%, transparent 60%),
                var(--bg);
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 0 60px rgba(0,229,255,0.05);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .logo span { color: var(--accent2); }

  .subtitle-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .section-title {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
    margin-top: 24px;
  }

  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  select option { background: #1a1a2e; }

  .lang-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .lang-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.85rem;
  }

  .lang-check:hover { border-color: var(--accent); background: rgba(0,229,255,0.05); }
  .lang-check input { width: auto; }
  .lang-check.selected { border-color: var(--accent); background: rgba(0,229,255,0.08); }

  .btn-primary {
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover { background: #33eeff; transform: translateY(-1px); }

  /* === GLOSSARY SECTION === */
  .glossary-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .glossary-row input { flex: 1; }

  .btn-add {
    padding: 12px 16px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-add:hover { background: rgba(0,229,255,0.1); }

  .glossary-list {
    max-height: 160px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.3);
  }

  .glossary-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    gap: 8px;
  }

  .glossary-item:hover { background: rgba(255,255,255,0.04); }

  .glossary-item .abbr { color: var(--accent); font-weight: 700; min-width: 60px; }
  .glossary-item .full { color: var(--text-dim); flex: 1; }
  .glossary-item .del { color: var(--red); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
  .glossary-item .del:hover { color: #ff6688; }

  .empty-gloss { color: var(--text-dim); font-size: 0.8rem; text-align: center; padding: 16px; }

  /* === DISPLAY SCREEN === */
  #display-screen {
    background: #000;
    position: relative;
    justify-content: flex-end;
  }

  .display-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0d0d1a 0%, #000 70%);
    z-index: 0;
  }

  .display-content {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(0,0,0,0.7);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }

  .top-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  .top-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: all 0.3s;
  }

  .status-dot.listening {
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .btn-mic {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-mic:hover { background: rgba(0,229,255,0.1); }
  .btn-mic.active { background: var(--accent); color: #000; }

  .btn-settings {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .btn-settings:hover { border-color: var(--text-dim); color: var(--text); }

  /* Subtitle area */
  .subtitle-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 40px 60px;
    gap: 16px;
  }

  .original-text {
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    color: rgba(255,255,255,0.5);
    text-align: center;
    max-width: 1000px;
    line-height: 1.6;
    min-height: 2em;
    transition: all 0.3s;
    font-weight: 400;
  }

  .translations-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 1200px;
  }

  .translation-block {
    background: var(--subtitle-bg);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px 40px;
    width: 100%;
    text-align: center;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .translation-block::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--lang-color, var(--accent));
  }

  .lang-tag {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--lang-color, var(--accent));
    margin-bottom: 6px;
    font-family: 'Noto Sans', sans-serif;
  }

  .trans-text {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
    font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
  }

  .trans-loading {
    color: var(--text-dim);
    font-size: 1rem;
    font-style: italic;
  }

  /* Interim text indicator */
  .interim-indicator {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(2rem, 5vw, 4rem);
    color: rgba(255,255,255,0.08);
    text-align: center;
    max-width: 80%;
    pointer-events: none;
    z-index: 0;
    font-weight: 900;
    line-height: 1.2;
  }

  .idle-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-dim);
    z-index: 2;
  }

  .idle-message .idle-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .idle-message p {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.4;
  }

  /* Font size control */
  .font-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .font-btn {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .font-btn:hover { border-color: var(--accent); color: var(--accent); }

  .font-size-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    min-width: 30px;
    text-align: center;
  }

  /* Scrollbar */
  .glossary-list::-webkit-scrollbar { width: 4px; }
  .glossary-list::-webkit-scrollbar-track { background: transparent; }
  .glossary-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Responsive for projector */
  @media (max-width: 768px) {
    .subtitle-area { padding: 20px; }
    .translation-block { padding: 16px 24px; }
  }
</style>
</head>
<body>

<!-- ===== SETUP SCREEN ===== -->
<div id="setup-screen" class="screen active">
  <div class="setup-card">
    <div class="logo">LIVE<span>TRANS</span></div>
    <div class="subtitle-label">リアルタイム字幕翻訳システム</div>

    <!-- API Key -->
    <div class="section-title">Google Translate API キー</div>
    <input type="password" id="api-key-input" placeholder="AIza..." autocomplete="off">

    <!-- Languages -->
    <div class="section-title">翻訳先言語（複数選択可）</div>
    <div class="lang-grid" id="lang-grid">
      <!-- generated by JS -->
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;margin-bottom:4px">
      <select id="extra-lang-select" size="1" style="flex:1;max-height:200px">
        <option value="">＋ その他の言語を追加...</option>
      </select>
      <button class="btn-add" onclick="addExtraLang()">追加</button>
    </div>

    <!-- Glossary -->
    <div class="section-title">専門用語辞書</div>
    <div class="glossary-row">
      <input type="text" id="gloss-abbr" placeholder="略語・元の言葉（例：GA）" style="flex:0.8">
      <span style="display:flex;align-items:center;color:var(--text-dim);padding:0 4px">→</span>
      <input type="text" id="gloss-full" placeholder="正式名称（例：ガーディアンエンジェル）">
      <button class="btn-add" onclick="addGlossary()">＋</button>
    </div>

    <div class="glossary-list" id="glossary-list">
      <div class="empty-gloss" id="gloss-empty">登録された用語はありません</div>
    </div>

    <button class="btn-primary" onclick="startDisplay()">▶ 字幕表示を開始</button>
  </div>
</div>

<!-- ===== DISPLAY SCREEN ===== -->
<div id="display-screen" class="screen">
  <div class="display-bg"></div>
  <div class="display-content">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="top-logo">LIVETRANS</div>
      <div class="top-controls">
        <div class="font-controls">
          <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
          <span class="font-size-label" id="font-size-label">100%</span>
          <button class="font-btn" onclick="changeFontSize(1)">A＋</button>
        </div>
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">待機中</span>
        <button class="btn-mic" id="mic-btn" onclick="toggleListening()">🎤 開始</button>
        <button class="btn-settings" onclick="goBack()">⚙ 設定</button>
      </div>
    </div>

    <!-- Main area -->
    <div class="subtitle-area" id="subtitle-area">
      <div class="idle-message" id="idle-message">
        <div class="idle-icon">🎤</div>
        <p>「開始」を押して字幕を開始</p>
      </div>
      <div class="original-text" id="original-text"></div>
      <div class="translations-container" id="translations-container"></div>
    </div>
  </div>
</div>

  { code: 'si', name: 'සිංහල', ja: 'シンハラ語' },
  { code: 'sk', name: 'Slovenčina', ja: 'スロバキア語' },
  { code: 'sl', name: 'Slovenščina', ja: 'スロベニア語' },
  { code: 'so', name: 'Soomaali', ja: 'ソマリ語' },
  { code: 'es', name: 'Español', ja: 'スペイン語' },
  { code: 'su', name: 'Sunda', ja: 'スンダ語' },
  { code: 'sw', name: 'Kiswahili', ja: 'スワヒリ語' },
  { code: 'sv', name: 'Svenska', ja: 'スウェーデン語' },
  { code: 'tg', name: 'Тоҷикӣ', ja: 'タジク語' },
  { code: 'ta', name: 'தமிழ்', ja: 'タミル語' },
  { code: 'tt', name: 'Татар', ja: 'タタール語' },
  { code: 'te', name: 'తెలుగు', ja: 'テルグ語' },
  { code: 'th', name: 'ภาษาไทย', ja: 'タイ語' },
  { code: 'tr', name: 'Türkçe', ja: 'トルコ語' },
  { code: 'tk', name: 'Türkmen', ja: 'トルクメン語' },
  { code: 'uk', name: 'Українська', ja: 'ウクライナ語' },
  { code: 'ur', name: 'اردو', ja: 'ウルドゥー語' },
  { code: 'ug', name: 'ئۇيغۇرچە', ja: 'ウイグル語' },
  { code: 'uz', name: 'Oʻzbekcha', ja: 'ウズベク語' },
  { code: 'vi', name: 'Tiếng Việt', ja: 'ベトナム語' },
  { code: 'cy', name: 'Cymraeg', ja: 'ウェールズ語' },
  { code: 'xh', name: 'isiXhosa', ja: 'コーサ語' },
  { code: 'yi', name: 'יידיש', ja: 'イディッシュ語' },
  { code: 'yo', name: 'Yorùbá', ja: 'ヨルバ語' },
  { code: 'zu', name: 'isiZulu', ja: 'ズールー語' },
].map(l => ({ ...l, color: '#' + Math.floor(Math.abs(Math.sin(l.code.charCodeAt(0) * 999) * 16777215)).toString(16).padStart(6,'0') }));

// ===== STATE =====
let apiKey = '';
let selectedLangs = ['en', 'vi'];
let glossary = {};
let recognition = null;
let isListening = false;
let fontScale = 1.0;
let translateTimeout = null;
let extraLangs = [];
let lastTranslatedText = '';

// ===== INIT =====
window.onload = () => {
  loadSaved();
  renderLangGrid();
  renderGlossary();
  initExtraLangDropdown();
};

function loadSaved() {
  const saved = localStorage.getItem('livetrans_data');
  if (saved) {
    const d = JSON.parse(saved);
    apiKey = d.apiKey || '';
    selectedLangs = d.selectedLangs || ['en', 'vi'];
    glossary = d.glossary || {};
    fontScale = d.fontScale || 1.0;
    extraLangs = d.extraLangs || [];
    document.getElementById('api-key-input').value = apiKey ? '••••••••••••••••' : '';
  }
}

function saveData() {
  const realKey = document.getElementById('api-key-input').value;
  if (realKey && !realKey.includes('•')) apiKey = realKey;
  localStorage.setItem('livetrans_data', JSON.stringify({
    apiKey, selectedLangs, glossary, fontScale, extraLangs
  }));
}

// ===== LANG GRID =====
function renderLangGrid() {
  const grid = document.getElementById('lang-grid');
  const allLangs = [...LANGUAGES, ...extraLangs];
  grid.innerHTML = allLangs.map(l => `
    <div class="lang-check ${selectedLangs.includes(l.code) ? 'selected' : ''}" data-code="${l.code}" onclick="toggleLang('${l.code}', this)">
      <span style="width:8px;height:8px;border-radius:50%;background:${l.color};flex-shrink:0;display:inline-block"></span>
      <span style="display:flex;flex-direction:column;gap:1px">
        <span style="font-size:0.75rem;color:var(--text-dim)">${l.ja}</span>
        <span>${l.name}</span>
      </span>
    </div>
  `).join('');
}

function toggleLang(code, el) {
  const idx = selectedLangs.indexOf(code);
  if (idx >= 0) {
    if (selectedLangs.length <= 1) return;
    selectedLangs.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    selectedLangs.push(code);
    el.classList.add('selected');
  }
}

// ===== EXTRA LANG DROPDOWN =====
function initExtraLangDropdown() {
  const sel = document.getElementById('extra-lang-select');
  sel.innerHTML = '<option value="">＋ その他の言語を追加...</option>';
  EXTRA_LANGUAGES.forEach(l => {
    const allLangs = [...LANGUAGES, ...extraLangs];
    if (!allLangs.find(x => x.code === l.code)) {
      const opt = document.createElement('option');
      opt.value = l.code;
      opt.textContent = l.ja + ' / ' + l.name;
      sel.appendChild(opt);
    }
  });
}

function addExtraLang() {
  const sel = document.getElementById('extra-lang-select');
  const code = sel.value;
  if (!code) return;
  const lang = EXTRA_LANGUAGES.find(l => l.code === code);
  if (!lang) return;
  extraLangs.push(lang);
  selectedLangs.push(code);
  renderLangGrid();
  initExtraLangDropdown();
}

// ===== GLOSSARY =====
function addGlossary() {
  const abbr = document.getElementById('gloss-abbr').value.trim();
  const full = document.getElementById('gloss-full').value.trim();
  if (!abbr || !full) return;
  glossary[abbr] = full;
  document.getElementById('gloss-abbr').value = '';
  document.getElementById('gloss-full').value = '';
  renderGlossary();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'gloss-full') addGlossary();
});

function removeGlossary(key) {
  delete glossary[key];
  renderGlossary();
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderGlossary() {
  const list = document.getElementById('glossary-list');
  const keys = Object.keys(glossary);
  if (keys.length === 0) {
    list.innerHTML = '<div class="empty-gloss">登録された用語はありません</div>';
    return;
  }
  list.innerHTML = keys.map(k => `
    <div class="glossary-item">
      <span class="abbr">${escapeHtml(k)}</span>
      <span style="color:var(--text-dim);padding:0 4px">→</span>
      <span class="full">${escapeHtml(glossary[k])}</span>
      <span class="del" onclick="removeGlossary('${escapeHtml(k)}')">✕</span>
    </div>
  `).join('');
}

// ===== APPLY GLOSSARY =====
function applyGlossary(text) {
  let result = text;
  for (const [abbr, full] of Object.entries(glossary)) {
    const regex = new RegExp(`(?<![\\w])${escapeRegex(abbr)}(?![\\w])`, 'g');
    result = result.replace(regex, full);
  }
  return result;
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ===== START DISPLAY =====
function startDisplay() {
  const inputKey = document.getElementById('api-key-input').value.trim();
  if (inputKey && !inputKey.includes('•')) apiKey = inputKey;

  if (!apiKey) {
    alert('APIキーを入力してください');
    return;
  }
  saveData();

  document.getElementById('setup-screen').classList.remove('active');
  document.getElementById('display-screen').classList.add('active');

  initTranslationBlocks();
  setTimeout(updateFontSize, 0);
}

function goBack() {
  stopListening();
  document.getElementById('display-screen').classList.remove('active');
  document.getElementById('setup-screen').classList.add('active');
  document.getElementById('api-key-input').value = '••••••••••••••••';
}

// ===== TRANSLATION BLOCKS =====
function initTranslationBlocks() {
  const container = document.getElementById('translations-container');
  container.innerHTML = selectedLangs.map(code => {
    const lang = [...LANGUAGES, ...extraLangs].find(l => l.code === code);
    return `
      <div class="translation-block" id="block-${code}" style="--lang-color:${lang?.color || '#00e5ff'}">
        <div class="lang-tag">${lang?.ja ? lang.ja + ' / ' : ''}${lang?.name || code}</div>
        <div class="trans-text" id="trans-${code}">—</div>
      </div>
    `;
  }).join('');
}

// ===== SPEECH RECOGNITION =====
function toggleListening() {
  if (isListening) stopListening();
  else startListening();
}

function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('このブラウザは音声認識に対応していません。Chromeを使用してください。');
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('mic-btn').textContent = '⏹ 停止';
    document.getElementById('mic-btn').classList.add('active');
    document.getElementById('status-dot').classList.add('listening');
    document.getElementById('status-text').textContent = '認識中...';
    document.getElementById('idle-message').style.display = 'none';
  };

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }

    const displayText = applyGlossary(final || interim);
    document.getElementById('original-text').textContent = displayText;

    if (final) {
      const processed = applyGlossary(final);
      if (processed !== lastTranslatedText) {
        lastTranslatedText = processed;
        clearTimeout(translateTimeout);
        translateAll(processed);
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    console.error('認識エラー:', e.error);
    document.getElementById('status-text').textContent = 'エラー: ' + e.error;
  };

  recognition.onend = () => {
    if (isListening) recognition.start(); // 自動再起動
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  if (recognition) { recognition.stop(); recognition = null; }
  document.getElementById('mic-btn').textContent = '🎤 開始';
  document.getElementById('mic-btn').classList.remove('active');
  document.getElementById('status-dot').classList.remove('listening');
  document.getElementById('status-text').textContent = '待機中';
}

// ===== TRANSLATE =====
async function translateAll(text) {
  if (!text.trim()) return;

  // Show loading
  selectedLangs.forEach(code => {
    const el = document.getElementById(`trans-${code}`);
    if (el) el.innerHTML = '<span class="trans-loading">翻訳中...</span>';
  });

  const promises = selectedLangs.map(code => translateText(text, code));
  const results = await Promise.all(promises);

  selectedLangs.forEach((code, i) => {
    const el = document.getElementById(`trans-${code}`);
    if (el) el.textContent = results[i] || '—';
  });
}

async function translateText(text, targetLang) {
  try {
    const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        q: text,
        source: 'ja',
        target: targetLang,
        format: 'text'
      })
    });
    const data = await res.json();
    if (data.error) {
      console.error('翻訳エラー:', data.error.message);
      return '[エラー]';
    }
    return data.data?.translations?.[0]?.translatedText || '—';
  } catch (e) {
    console.error(e);
    return '[通信エラー]';
  }
}

// ===== FONT SIZE =====
function changeFontSize(dir) {
  fontScale = Math.max(0.6, Math.min(2.0, fontScale + dir * 0.1));
  updateFontSize();
  saveData();
}

function updateFontSize() {
  const pct = Math.round(fontScale * 100);
  document.getElementById('font-size-label').textContent = pct + '%';
  document.querySelectorAll('.trans-text').forEach(el => {
    el.style.fontSize = `clamp(1.4rem, ${4 * fontScale}vw, ${3 * fontScale}rem)`;
  });
  document.getElementById('original-text').style.fontSize =
    `clamp(1rem, ${2.5 * fontScale}vw, ${1.8 * fontScale}rem)`;
}
</script>
